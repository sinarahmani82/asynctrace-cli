[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asynctrace-cli"
version = "0.1.0"
authors = [
  { name="Sina Rahmani", email="your-email@gmail.com" },
]
description = "A lightweight async latency and memory profiling tool"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Profilers",
]

[project.scripts]
asynctrace = "src.cli:main"
